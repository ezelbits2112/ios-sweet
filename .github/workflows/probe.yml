name: probe
on:
  workflow_dispatch:
jobs:
  p13:
    runs-on: macos-13
    steps: [{run: 'sw_vers; ls -d /Applications/Xcode*.app 2>/dev/null; xcodebuild -version 2>&1 | head -3'}]
  p14:
    runs-on: macos-14
    steps: [{run: 'sw_vers; ls -d /Applications/Xcode*.app 2>/dev/null; xcodebuild -version 2>&1 | head -3'}]
  p15intel:
    runs-on: macos-15-intel
    steps: [{run: 'sw_vers; ls -d /Applications/Xcode*.app 2>/dev/null; xcodebuild -version 2>&1 | head -3'}]
  p15arm:
    runs-on: macos-15
    steps: [{run: 'sw_vers; ls -d /Applications/Xcode*.app 2>/dev/null; xcodebuild -version 2>&1 | head -3'}]
